name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monthly release; Renovate moves the pins in between.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 26
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 26
          distribution: temurin
      - name: Install configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcups2-dev libasound2-dev libfontconfig1-dev
      - name: Build
        run: scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jspecify-jdk-stubs
          path: build/out/jspecify-jdk-stubs.jar
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/*.log

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jspecify-jdk-stubs
          path: build/out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
