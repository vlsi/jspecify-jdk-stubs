org.gradle.configuration-cache=true

# The JDK that builds the stubs. The API of each release comes from its lib/ct.sym, so it has to be
# at least as new as the newest release in GA. Renovate moves it when the next major reaches GA.
# renovate: datasource=java-version depName=java-jdk versioning=regex:^(?<major>\d+)
jdkBuildVersion=27

# The JDK that runs javac with NullAway over the stubs in stubsTest; the build JDK when unset.
# jdkTestVersion=21
