[versions]
errorprone = "2.52.0"
junit = "6.1.3"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jspecify = "org.jspecify:jspecify:1.0.1"
# useJUnitJupiter takes only the version. The build does not use this entry; it gives Renovate the
# coordinates to look the version up.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
nullaway = "com.uber.nullaway:nullaway:0.14.3"
turbine = "com.google.turbine:turbine:1.17.0"
